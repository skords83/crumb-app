name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug APK, JVM tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

      - name: Build APKs, run JVM tests and lint
        run: >-
          ./gradlew --no-daemon --max-workers=2 --stacktrace --continue
          :app:assembleDebug :app:assembleDebugAndroidTest
          :app:testDebugUnitTest :app:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: crumb-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload test and lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: crumb-android-reports-${{ github.sha }}
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
